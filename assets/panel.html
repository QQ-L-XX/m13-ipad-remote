<title>M13 · iPad 遥控</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b1018;color:#edf2f7;font:16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid #334251;border-radius:12px;background:#1c2938;color:#edf2f7;min-height:48px;padding:10px 18px;outline-offset:2px}
button:active{background:#344b60;border-color:#77b6d8}button:disabled{opacity:.45}button:focus,select:focus,input:focus{outline:2px solid #86cde0}
header{position:absolute;left:0;right:0;top:0;height:78px;padding:10px 20px;background:#131e2b;border-bottom:1px solid #263648}
.topline{height:32px;white-space:nowrap}.brand{float:left;line-height:30px}.brand h1{display:inline;font-size:21px;letter-spacing:1px;margin:0 9px 0 0}.version{font-size:11px;color:#93a4b7;letter-spacing:0}.tag{display:inline-block;vertical-align:2px;padding:3px 9px;border-radius:12px;background:#203d43;color:#afe4d5;font-size:12px;margin-left:12px;line-height:18px}
.tools{float:right}#qualityWrap{display:inline-block;vertical-align:middle}#qualityWrap.inactive{opacity:.42}select{height:34px;font-size:13px;border:1px solid #34485c;border-radius:8px;background:#1b2b3b;color:#dce7f3;padding:3px 6px;max-width:132px}#retry{min-height:34px;height:34px;padding:4px 11px;font-size:13px;border-radius:8px;margin-left:6px}
.statusline{clear:both;height:23px;padding-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#connection{display:inline-block;width:6px;height:6px;border-radius:50%;background:#a8b4c1;vertical-align:2px;margin-right:6px}#connection.online{background:#81d1b7}#connection.busy{background:#e4b971}#connection.offline{background:#ed9f97}#msg{font-size:12px;color:#a9bbcc}
#desk{display:none}#stage{position:absolute;left:0;right:0;top:78px;bottom:96px;background:#05090e;overflow:hidden}#screen,#movie{position:absolute;display:block;background:#05090e;-webkit-user-select:none}#movie{display:none}
#keys{position:absolute;left:0;right:0;bottom:0;height:96px;padding:12px 20px 8px;background:#131e2b;border-top:1px solid #263648;text-align:center;-webkit-user-select:none}.nav{float:left;width:28%;white-space:nowrap;padding-top:1px}.nav button{width:45%;padding-left:6px;padding-right:6px;margin-right:4px}.nav .home{background:#243c47;border-color:#375560}.directions{float:right;width:68%;white-space:nowrap}.directions button{width:17%;max-width:80px;margin:0 2px;padding:10px 4px;font-size:21px}.directions .confirm{width:21%;max-width:96px;background:#bde1d6;color:#142e2a;border-color:#bde1d6;font-size:16px;font-weight:bold}#keyHint{clear:both;padding-top:7px;color:#8298ad;font-size:11px;letter-spacing:.3px}
#login{position:absolute;left:50%;top:48%;width:360px;max-width:90%;margin-left:-180px;margin-top:-120px;padding:28px;background:#152334;border:1px solid #2b4055;border-radius:18px}#login h2{font-size:24px;margin:0 0 10px}#login p{color:#a2b6c9;font-size:14px;line-height:1.7;margin:0 0 22px}#pw{display:block;width:100%;height:48px;background:#0c1723;color:#f1f6fa;border:1px solid #405a72;border-radius:10px;padding:10px 12px;-webkit-appearance:none}#login button{display:block;width:100%;background:#bde1d6;border-color:#bde1d6;color:#142e2a;font-weight:bold;margin-top:12px}#login .note{font-size:12px;margin:18px 0 0;color:#8299ae}
@media(orientation:portrait){#keys{height:150px;padding-top:12px}#stage{bottom:150px}.nav,.directions{float:none;width:100%}.nav{padding-top:0;margin-bottom:9px}.nav button{width:30%;max-width:160px;min-height:42px;padding:7px}.directions button{width:15%;max-width:76px;min-height:46px;padding:7px}.directions .confirm{width:20%;max-width:104px}#keyHint{padding-top:7px}}
@media(orientation:landscape) and (max-height:650px){header{height:64px;padding-top:5px;padding-bottom:5px}#stage{top:64px;bottom:86px}#keys{height:86px;padding-top:9px}#keyHint{padding-top:5px}}
@media(max-width:520px){header{padding-left:10px;padding-right:10px}.brand h1{font-size:18px;margin-right:5px}.version{font-size:10px}.tag{margin-left:5px;font-size:11px;padding:2px 6px}select{font-size:12px;max-width:96px}#retry{padding-left:7px;padding-right:7px;margin-left:3px}#keys{padding-left:8px;padding-right:8px}.directions button{margin:0 1px}#login{left:5%;margin-left:0;width:90%}}
</style></head><body>
<header><div class="topline"><div class="brand"><h1>M13</h1><span class="version">0.8 · UI2</span><span class="tag" id="modeLabel">触屏桌面</span></div><div class="tools"><span id="qualityWrap"><select id="quality" aria-label="桌面画质" title="只调整桌面画质，影片保持原画" onchange="quality(this.value)"><option value="clear">桌面 · 清晰</option><option value="original">桌面 · 原画</option><option value="smooth">桌面 · 流畅</option></select></span><button id="retry" onclick="reconnect()" aria-label="重新连接盒子">重连</button></div></div><div class="statusline" role="status" aria-live="polite"><span id="connection" class="busy"></span><span id="msg">正在连接盒子…</span></div></header>
<form id="login" onsubmit="login();return false"><h2>连接你的 M13</h2><p>让旧 iPad 成为随手可用的屏幕。<br>请和电视盒子连接同一个 Wi-Fi。</p><input id="pw" type="password" placeholder="输入连接密码" aria-label="连接密码" autocomplete="current-password" required><button type="submit">连接盒子</button><p class="note">密码可在电视的「iPad 桌面连接」中查看。</p></form>
<div id="desk"><div id="stage"><img id="screen" alt="正在取得盒子画面" draggable="false"><video id="movie" controls webkit-playsinline playsinline preload="metadata"></video></div><div id="keys" role="group" aria-label="盒子遥控器"><div class="nav"><button onclick="key(4)">返回</button><button class="home" onclick="key(3)">首页</button></div><div class="directions"><button onclick="key(21)" aria-label="向左，影片快退十秒">&#8592;</button><button onclick="key(19)" aria-label="向上">&#8593;</button><button class="confirm" onclick="key(23)" aria-label="确认，影片暂停或继续">确认</button><button onclick="key(20)" aria-label="向下">&#8595;</button><button onclick="key(22)" aria-label="向右，影片快进十秒">&#8594;</button></div><div id="keyHint">轻点操作 · 滑动滚动</div></div></div>
<script src="/sync.js"></script>
<script>

var live=false,timer=0,videoTimer=0,autoTimer=0,autoBusy=false,fail=0,point=null,mouse=false,videoMode=false,videoReady=false,film=false,filmSeek=0,preparing=false,pendingKind='film',autoKey='',blockedKey='',revision=0,gestureId='',touchBusy=false,touchQueue=[],pendingMove=null,moveTimer=0,holdTimer=0;
var tvState=null,lastSyncSeekAt=0,syncSeekPending=false,syncSeekBegan=0,controlMuteUntil=0,localControlUntil=0,everPlayed=false,controlBusy=false,controlQueue=[],lastSyncReport=0,syncDifference=0,syncCorrections=0;
var displayImage=document.getElementById('screen'),movie=document.getElementById('movie');
function say(s){var m=document.getElementById('msg');if(m.textContent!==s)m.textContent=s;m.title=s;document.getElementById('connection').className=/中断|错误|异常|失败/.test(s)?'offline':(/正在|缓冲|恢复/.test(s)?'busy':'online');}
function uiMode(){var title=document.getElementById('modeLabel'),hint=document.getElementById('keyHint');title.textContent=videoMode?(film?'影片 · 原声':'影片 · 无声'):'触屏桌面';hint.textContent=videoMode&&film?'左右快进 10 秒 · 确认暂停／继续':'轻点操作 · 滑动滚动';document.getElementById('qualityWrap').className=videoMode?'inactive':'';}
function request(path,body,done,failed){var x=new XMLHttpRequest();x.open(body!==null?'POST':'GET',path,true);x.timeout=8000;if(body!==null&&path!=='/login'){x.setRequestHeader('X-M13-Control','1');x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');}x.onload=function(){var d;try{d=JSON.parse(x.responseText);}catch(e){say('盒子响应异常');if(failed)failed();return;}if(x.status===401){live=false;clearTimeout(timer);clearTimeout(videoTimer);clearTimeout(autoTimer);clearInterval(holdTimer);point=null;touchQueue=[];touchBusy=false;revision++;movie.pause();document.getElementById('desk').style.display='none';document.getElementById('login').style.display='block';say(d.error||'请输入连接密码');if(failed)failed();return;}if(x.status>=400){say(d.error||'操作失败');if(failed)failed();return;}if(done)done(d);};x.onerror=x.ontimeout=function(){say('盒子连接中断，请检查 Wi-Fi 后重连');if(failed)failed();};x.send(body);}
function login(){request('/login',document.getElementById('pw').value,function(){document.getElementById('pw').value='';request('/status',null,function(d){document.getElementById('quality').value=d.profile||'clear';start();});});}
function layout(){var r=document.getElementById('stage').getBoundingClientRect(),w=r.width,h=r.height;if(!w||!h)return;var width=Math.min(w,h*16/9),height=width*9/16;var items=[displayImage,movie];for(var i=0;i<items.length;i++){items[i].style.width=width+'px';items[i].style.height=height+'px';items[i].style.left=(w-width)/2+'px';items[i].style.top=(h-height)/2+'px';}}
function start(){uiMode();document.getElementById('login').style.display='none';document.getElementById('desk').style.display='block';live=true;layout();refresh();scheduleAuto(0);}
function refresh(){clearTimeout(timer);if(live&&!videoMode&&!document.hidden)displayImage.src='/frame.jpg?next=1&n='+new Date().getTime();}
function reconnect(){blockedKey='';autoKey='';leaveVideo(false);scheduleAuto(0);}
displayImage.onload=function(){layout();fail=0;if(videoMode)return;say(preparing?'正在接入影片，请稍候…':'已连接 · 进入 LibreTV 后自动接入影片');if(live)timer=setTimeout(refresh,30);};displayImage.onerror=function(){if(!live||videoMode)return;fail++;say('正在恢复画面…');if(fail%3===0)request('/status',null,function(){refresh();});timer=setTimeout(refresh,Math.min(5000,600+fail*500));};
function quality(mode){if(!live||videoMode)return;request('/profile','profile='+encodeURIComponent(mode),function(){setTimeout(refresh,300);});}
function key(n){if(!live)return;cancelTouch();if(n===3||n===4){blockedKey=autoKey;leaveVideo(false);}else if(videoMode&&film){if(n===23){if(movie.paused)playVideo();else movie.pause();return;}if(n===21||n===22){try{movie.currentTime=Math.max(0,Math.min(movie.duration||1e10,movie.currentTime+(n===21?-10:10)));}catch(e){}return;}}request('/input','action=key&key='+n,function(){if(!videoMode)refresh();scheduleAuto(100);});}
function pos(x,y){var r=displayImage.getBoundingClientRect();return {x:Math.max(0,Math.min(1,(x-r.left)/r.width)),y:Math.max(0,Math.min(1,(y-r.top)/r.height))};}
function sendTouches(){if(touchBusy||!touchQueue.length||!live)return;var e=touchQueue.shift();touchBusy=true;request('/input','action=touch&phase='+e.phase+'&gesture='+e.gesture+'&x='+e.p.x+'&y='+e.p.y,function(){touchBusy=false;sendTouches();if(e.phase==='up'||e.phase==='cancel'){refresh();scheduleAuto(120);}},function(){touchBusy=false;touchQueue=[];point=null;clearInterval(holdTimer);clearTimeout(moveTimer);pendingMove=null;});}
function queueTouch(phase,p,g){var e={phase:phase,p:p,gesture:g},last=touchQueue.length?touchQueue[touchQueue.length-1]:null;if(phase==='move'&&last&&last.phase==='move'&&last.gesture===g)touchQueue[touchQueue.length-1]=e;else touchQueue.push(e);sendTouches();}
function flushMove(){clearTimeout(moveTimer);moveTimer=0;if(pendingMove&&point){queueTouch('move',pendingMove,gestureId);pendingMove=null;}}
function down(x,y){if(!live||videoMode)return;cancelTouch();gestureId=String(new Date().getTime());point=pos(x,y);queueTouch('down',point,gestureId);holdTimer=setInterval(function(){if(point)queueTouch('move',point,gestureId);},700);}
function move(x,y){if(!point||videoMode)return;point=pos(x,y);pendingMove=point;if(!moveTimer)moveTimer=setTimeout(flushMove,65);}
function up(x,y){if(!point)return;point=pos(x,y);pendingMove=point;flushMove();var p=point,g=gestureId;point=null;clearInterval(holdTimer);queueTouch('up',p,g);}
function cancelTouch(){clearInterval(holdTimer);clearTimeout(moveTimer);moveTimer=0;pendingMove=null;if(point){var p=point,g=gestureId;point=null;queueTouch('cancel',p,g);}}
displayImage.addEventListener('touchstart',function(e){if(e.touches.length!==1){cancelTouch();return;}e.preventDefault();down(e.touches[0].clientX,e.touches[0].clientY);},false);
displayImage.addEventListener('touchmove',function(e){e.preventDefault();if(e.touches.length===1)move(e.touches[0].clientX,e.touches[0].clientY);else cancelTouch();},false);
displayImage.addEventListener('touchend',function(e){e.preventDefault();if(e.changedTouches.length)up(e.changedTouches[0].clientX,e.changedTouches[0].clientY);},false);
displayImage.addEventListener('touchcancel',cancelTouch,false);
displayImage.onmousedown=function(e){e.preventDefault();mouse=true;down(e.clientX,e.clientY);};document.onmousemove=function(e){if(mouse){e.preventDefault();move(e.clientX,e.clientY);}};document.onmouseup=function(e){if(mouse){mouse=false;up(e.clientX,e.clientY);}};


function scheduleAuto(delay){clearTimeout(autoTimer);if(live&&!document.hidden)autoTimer=setTimeout(watchAuto,delay);}
function watchAuto(){if(!live||document.hidden)return;if(autoBusy){scheduleAuto(500);return;}autoBusy=true;var began=new Date().getTime();request('/auto/status',null,function(d){autoBusy=false;d.networkMs=new Date().getTime()-began;d.receivedAt=new Date().getTime();tvState=d;applyAuto(d);syncMovie(false);scheduleAuto(1200);},function(){autoBusy=false;scheduleAuto(2500);});}
function applyAuto(d){if(!d.known)return;if(!d.active){blockedKey='';autoKey='';if(videoMode||preparing)leaveVideo(false);return;}if(d.key===blockedKey||d.key===autoKey)return;autoKey=d.key;beginFilm();}
function leaveVideo(clearIdentity){revision++;clearTimeout(videoTimer);preparing=false;videoMode=false;film=false;videoReady=false;filmSeek=0;syncSeekPending=false;everPlayed=false;controlQueue=[];movie.pause();movie.removeAttribute('src');movie.load();movie.style.display='none';displayImage.style.display='block';document.getElementById('quality').disabled=false;uiMode();if(clearIdentity)autoKey='';request('/live/stop','',function(){});refresh();layout();}
function beginFilm(){revision++;var rev=revision;cancelTouch();clearTimeout(videoTimer);preparing=true;pendingKind='film';videoReady=false;say('正在接入影片和声音…');request('/film/prepare','',function(){if(rev===revision)pollFilm(rev);},function(){if(rev===revision)beginMirror(rev);});}
function pollFilm(rev){clearTimeout(videoTimer);if(!live||rev!==revision||!preparing)return;request('/film/status',null,function(d){if(rev!==revision)return;if(d.error){beginMirror(rev);return;}if(d.ready&&!d.preparing){filmSeek=Math.max(0,(d.positionMs||0)/1000);showVideo(d.playlist,true,rev);return;}videoTimer=setTimeout(function(){pollFilm(rev);},1000);},function(){if(rev===revision)beginMirror(rev);});}
function beginMirror(rev){if(rev!==revision)return;pendingKind='mirror';say('当前片源原声暂不可用，正在接入流畅画面…');request('/live/start','',function(){pollMirror(rev);});}
function pollMirror(rev){clearTimeout(videoTimer);if(!live||rev!==revision||!preparing)return;request('/live/status',null,function(d){if(rev!==revision)return;if(d.error){preparing=false;blockedKey=autoKey;say('影片接入失败，可点重连重试');return;}if(d.running&&d.ready&&d.segments>=3){filmSeek=0;showVideo('/live/index.m3u8?n='+new Date().getTime(),false,rev);return;}videoTimer=setTimeout(function(){pollMirror(rev);},1500);});}
function showVideo(src,hasAudio,rev){if(rev!==revision)return;clearTimeout(timer);preparing=false;videoMode=true;film=hasAudio;videoReady=true;everPlayed=false;lastSyncSeekAt=0;syncSeekPending=false;localControlUntil=0;document.getElementById('quality').disabled=true;uiMode();displayImage.style.display='none';movie.style.display='block';movie.poster='/frame.jpg?n='+new Date().getTime();movie.src=src;movie.load();layout();say(hasAudio?'影片已接入，正在播放…':'流畅画面已接入，此片源暂无声音');playback('autoReady');syncMovie(true);if(!film||!tvState||tvState.playing)playVideo(true);videoTimer=setTimeout(function(){if(rev===revision&&movie.paused)say('轻点影片画面中的 ▶ 播放；无需切换模式');},1800);}
function playVideo(automatic){if(!videoReady)return;if(automatic)controlMuteUntil=new Date().getTime()+1000;playback('playClick');try{var p=movie.play();if(p&&p.catch)p.catch(function(){say('轻点影片画面中的 ▶ 播放；无需切换模式');});}catch(e){say('轻点影片画面中的 ▶ 播放；无需切换模式');}}

function sendTVControl(operation,seconds){if(!film||!videoMode||!autoKey)return;localControlUntil=new Date().getTime()+6000;var command={operation:operation,key:autoKey,revision:revision,position:Math.round(Math.max(0,seconds||0)*1000)},last=controlQueue.length?controlQueue[controlQueue.length-1]:null;if(last&&last.operation===operation)controlQueue[controlQueue.length-1]=command;else controlQueue.push(command);if(controlQueue.length>6)controlQueue.shift();flushTVControl();}
function flushTVControl(){if(controlBusy||!controlQueue.length)return;var command=controlQueue.shift();if(command.revision!==revision||command.key!==autoKey){flushTVControl();return;}controlBusy=true;request('/film/control','operation='+command.operation+'&key='+command.key+'&positionMs='+command.position,function(){controlBusy=false;if(command.revision===revision){localControlUntil=new Date().getTime()+3000;scheduleAuto(100);}flushTVControl();},function(){controlBusy=false;localControlUntil=0;say('同步操作暂未完成，请检查盒子后重试');flushTVControl();});}
function syncMovie(force){if(!film||!videoMode||!videoReady||!tvState||tvState.key!==autoKey||document.hidden)return;var now=new Date().getTime();if(now<localControlUntil)return;if(syncSeekPending){if(now-syncSeekBegan<8000)return;syncSeekPending=false;}var plan=M13Sync.plan(tvState,{ready:movie.readyState>=1,time:movie.currentTime,duration:movie.duration,seeking:movie.seeking,lastSeekAt:force?0:lastSyncSeekAt},now);if(!plan)return;syncDifference=Math.round(plan.difference*1000)/1000;if(plan.seek){try{syncSeekPending=true;syncSeekBegan=now;lastSyncSeekAt=now;syncCorrections++;movie.currentTime=plan.target;playback('syncCorrect');}catch(e){syncSeekPending=false;}}if(!plan.playing&&!movie.paused){controlMuteUntil=now+1200;movie.pause();}else if(plan.playing&&movie.paused&&everPlayed){playVideo(true);}}
function playback(event){if(!videoMode)return;var code=movie.error?movie.error.code:0;request('/playback','event='+encodeURIComponent(event)+'&mode='+(film?'autoFilm':'autoMirror')+'&code='+code+'&ready='+movie.readyState+'&network='+movie.networkState+'&time='+movie.currentTime+'&width='+movie.videoWidth+'&height='+movie.videoHeight+'&difference='+syncDifference+'&corrections='+syncCorrections+'&paused='+(movie.paused?1:0),function(){});}
movie.onplaying=function(){everPlayed=true;say(film?'影片播放中 · 暂停和进度同步控制电视':'流畅画面播放中 · 此片源暂无声音');playback('playing');};movie.onloadedmetadata=function(){layout();syncMovie(true);playback('metadata');};movie.oncanplay=function(){syncMovie(false);};movie.onwaiting=function(){if(videoMode){say('影片缓冲中…');playback('waiting');}};movie.onerror=function(){if(videoMode){say('影片错误 '+(movie.error?movie.error.code:'未知')+'，可点重连重试');playback('error');}};movie.onpause=function(){playback('pause');if(film&&videoMode&&everPlayed&&!document.hidden&&new Date().getTime()>controlMuteUntil)sendTVControl('pause');};movie.onplay=function(){if(film&&videoMode&&!document.hidden&&new Date().getTime()>controlMuteUntil)sendTVControl('play');};movie.onseeking=function(){if(film&&!syncSeekPending)localControlUntil=new Date().getTime()+6000;};movie.onseeked=function(){if(syncSeekPending){syncSeekPending=false;playback('syncSeeked');return;}if(film&&videoMode)sendTVControl('seek',movie.currentTime);};movie.ontimeupdate=function(){var now=new Date().getTime();if(film&&videoMode&&now-lastSyncReport>4000){lastSyncReport=now;syncMovie(false);playback('sync');}};
window.addEventListener('resize',layout,false);window.addEventListener('orientationchange',function(){setTimeout(layout,250);},false);
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelTouch();clearTimeout(timer);clearTimeout(videoTimer);clearTimeout(autoTimer);}else if(live){layout();if(!videoMode)refresh();scheduleAuto(0);if(preparing){if(pendingKind==='mirror')pollMirror(revision);else pollFilm(revision);}}},false);
request('/status',null,function(d){document.getElementById('quality').value=d.profile||'clear';start();});

</script></body></html>
